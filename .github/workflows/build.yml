name: C build (not scientific validation)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libfftw3-dev libgsl-dev libcfitsio-dev
      - name: Build selected targets
        run: make
